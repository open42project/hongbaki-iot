apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: gitlab
  labels:
    run: redis
spec:
  containers:
  - name: redis
    image: redis:8-alpine
    ports:
    - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gitlab
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    run: redis
